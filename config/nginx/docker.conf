map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=zws_global:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=zws_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=zws_conn:10m;

upstream zws_app {
    server app:3000;
    keepalive 64;
}

upstream zws_console_proxy {
    server worker:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ${SITE_DOMAIN};

    location /api/health {
        limit_req zone=zws_global burst=20 nodelay;
        proxy_pass http://zws_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SITE_DOMAIN};

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZWS_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml font/woff2;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://sdk.cashfree.com https://checkout.razorpay.com https://cdn.razorpay.com https://www.googletagmanager.com https://www.google-analytics.com https://challenges.cloudflare.com https://static.cloudflareinsights.com; connect-src 'self' https: wss:;" always;

    limit_conn zws_conn 80;

    location ~ ^/(login|zwsloginsam|api/auth|api/admin/auth) {
        limit_req zone=zws_auth burst=10 nodelay;
        proxy_pass http://zws_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/api/console/proxy/(vnc|serial)/(.+)$ {
        limit_req zone=zws_global burst=40 nodelay;
        proxy_pass http://zws_console_proxy/console/proxy/$1/$2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/vnc/proxy/(.+)$ {
        limit_req zone=zws_global burst=40 nodelay;
        proxy_pass http://zws_console_proxy/vnc/proxy/$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        limit_req zone=zws_global burst=80 nodelay;
        proxy_pass http://zws_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }
}
