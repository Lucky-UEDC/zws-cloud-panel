limit_req_zone $binary_remote_addr zone=zws_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=zws_auth:10m rate=3r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream zws_nextjs {
    server 127.0.0.1:${PORT};
    keepalive 64;
}

upstream zws_console_proxy {
    server 127.0.0.1:${VNC_PROXY_PORT};
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ${SITE_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /install.sh {
        alias ${ZWS_ROOT_DIR}/public/install.sh;
        default_type text/x-shellscript;
        add_header Content-Type "text/x-shellscript" always;
        add_header Cache-Control "no-store" always;
    }

    location = /install-source.sh {
        alias ${ZWS_ROOT_DIR}/public/install-source.sh;
        default_type text/x-shellscript;
        add_header Content-Type "text/x-shellscript" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${SITE_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${SITE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SITE_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ZWS_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml font/woff2;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /install.sh {
        alias ${ZWS_ROOT_DIR}/public/install.sh;
        default_type text/x-shellscript;
        add_header Content-Type "text/x-shellscript" always;
        add_header Cache-Control "no-store" always;
    }

    location = /install-source.sh {
        alias ${ZWS_ROOT_DIR}/public/install-source.sh;
        default_type text/x-shellscript;
        add_header Content-Type "text/x-shellscript" always;
        add_header Cache-Control "no-store" always;
    }

    location /_next/static/ {
        alias ${ZWS_ROOT_DIR}/.next/static/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/api/console/proxy/(vnc|serial)/(.+)$ {
        limit_req zone=zws_api burst=40 nodelay;
        proxy_pass http://zws_console_proxy/console/proxy/$1/$2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_socket_keepalive on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~ ^/vnc/proxy/(.+)$ {
        limit_req zone=zws_api burst=40 nodelay;
        proxy_pass http://zws_console_proxy/vnc/proxy/$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_socket_keepalive on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~ ^/(api/auth|login|register|forgot-password|reset-password)(/|$) {
        limit_req zone=zws_auth burst=12 nodelay;
        proxy_pass http://zws_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~ ^/(admin|api|client-area|payment|status|console|vnc|_next/webpack-hmr)(/|$) {
        limit_req zone=zws_api burst=40 nodelay;
        proxy_pass http://zws_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass http://zws_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
